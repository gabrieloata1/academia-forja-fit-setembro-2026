<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 72" fill="none" width="100%" height="100%">
  <defs>
    <!-- Degradê de Fogo / Magma da Forja -->
    <linearGradient id="ff-fire-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="50%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <!-- Degradê de Aço Escovado -->
    <linearGradient id="ff-steel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Degradê do Escudo / Forja -->
    <linearGradient id="ff-shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e232d"/>
      <stop offset="100%" stop-color="#0f1217"/>
    </linearGradient>
    <filter id="ff-fire-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff6a00" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Símbolo Emblemático: Escudo Forjado + Bigorna de Ferro + Raio da Forja + Haltere -->
  <g transform="translate(6, 6)" filter="url(#ff-fire-glow)">
    <!-- Escudo Hexagonal Carbono -->
    <polygon points="30,3 56,15 56,43 30,57 4,43 4,15" fill="url(#ff-shield-bg)" stroke="url(#ff-fire-grad)" stroke-width="2"/>
    <polygon points="30,7 52,17 52,41 30,53 8,41 8,17" fill="none" stroke="#2a313d" stroke-width="1.2"/>

    <!-- Haltere / Barra Olímpica de Fundo (Cruzando) -->
    <rect x="12" y="27.5" width="36" height="4" rx="2" fill="#3b4453"/>
    <rect x="13" y="24" width="3.5" height="11" rx="1" fill="url(#ff-steel-grad)"/>
    <rect x="43.5" y="24" width="3.5" height="11" rx="1" fill="url(#ff-steel-grad)"/>
    <rect x="10" y="26" width="3" height="7" rx="0.8" fill="#ff6a00"/>
    <rect x="47" y="26" width="3" height="7" rx="0.8" fill="#ff6a00"/>

    <!-- Bigorna de Aço Forjado (Símbolo de Resistência Extrema) -->
    <!-- Chifre e Corpo da Bigorna -->
    <path d="M17 31 L43 31 C40 31 38 34 37 36 L39 42 L21 42 L23 36 C22 34 20 31 17 31 Z" fill="url(#ff-steel-grad)"/>
    <!-- Base Pesada da Bigorna -->
    <path d="M19 42 L41 42 L44 46 L16 46 Z" fill="url(#ff-steel-grad)"/>

    <!-- O Raio Incandescente da Forja (Golpe de Impacto) -->
    <polygon points="32,7 23,26 31,26 27,41 39,22 30,22" fill="url(#ff-fire-grad)" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Faíscas Incandescentes da Forja -->
    <circle cx="21" cy="18" r="1.3" fill="#ffb300"/>
    <circle cx="39" cy="16" r="1.5" fill="#ff6a00"/>
    <circle cx="43" cy="22" r="1" fill="#ffd000"/>
  </g>

  <!-- Tipografia da Marca -->
  <g transform="translate(74, 11)">
    <!-- FORJA FIT -->
    <text x="0" y="34" font-family="'Barlow Condensed', 'Impact', sans-serif" font-size="34" font-weight="900" letter-spacing="1.5">
      <tspan fill="#ffffff">FORJA</tspan><tspan fill="url(#ff-fire-grad)">FIT</tspan>
    </text>

    <!-- Linha Divisória de Alta Performance com Faixa Laranja -->
    <rect x="1" y="41" width="55" height="2.5" rx="1" fill="url(#ff-fire-grad)"/>
    <rect x="60" y="41.5" width="165" height="1.5" fill="#2a313d"/>

    <!-- Tagline / Posicionamento -->
    <text x="1" y="52" font-family="'Inter', system-ui, sans-serif" font-size="8" font-weight="800" fill="#9aa4b2" letter-spacing="2.8">
      ACADEMIA &amp; CROSS TRAINING
    </text>
  </g>
</svg>
